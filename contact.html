<h1>Get in Touch</h1>

<p>Have a project idea or want to collaborate? Let's connect!</p>

<!-- Submissions are saved to Google Sheets by contact-sheet.js -->

<form id="contactForm" novalidate>

<input type="text" id="name" name="name" placeholder="Your Name" required />

<input type="email" id="email" name="email" placeholder="Your Email" required />

<textarea
id="message"
name="message"
rows="4"
placeholder="Your Message..."
required
></textarea>

<!-- Honeypot: hidden from humans, bots fill it in -->
<input type="text" id="website" name="website" tabindex="-1" autocomplete="off"
style="position:absolute;left:-9999px;opacity:0;height:0;width:0;" aria-hidden="true" />

<button type="submit" class="resume" style="margin-left: 23%">

Send Message

</button>

<p class="form-msg" id="formMsg" aria-live="polite">

✅ Message sent! I'll get back to you soon.

</p>

</form>
